version: 2

project_name: tfdoctor

before:
  hooks:
    - go mod tidy

builds:
  - id: tfdoctor
    main: ./cmd/tfdoctor
    binary: tfdoctor
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/ojarosch/tfdoctor/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: tfdoctor
    repository:
      owner: ojarosch
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/ojarosch/tfdoctor"
    description: "Check the engineering hygiene of a Terraform/OpenTofu repository"
    license: "Apache-2.0"
    install: |
      bin.install "tfdoctor"
    test: |
      system "#{bin}/tfdoctor", "--version"
